name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-0/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-specification-repository:
    name: Validate structure and documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required documents and local links
        run: python3 scripts/validate_repository.py
