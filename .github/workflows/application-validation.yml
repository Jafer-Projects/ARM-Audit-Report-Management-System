name: ARM application validation

on:
  pull_request:
  push:
    branches:
      - main
      - "implementation/**"
  workflow_dispatch:

permissions:
  contents: read

# Every independent check is a separate job. GitHub schedules these jobs in
# parallel; a failure in one job does not cancel or suppress the others.
# The workflow conclusion remains failure if any required job fails.
# Node.js runs the React/Vite desktop UI and the separate cloud API package
# under server/. Rust/Tauri remains the native desktop backend; PostgreSQL
# is the cloud source of truth for shared state as the cloud increment lands.
jobs:
  frontend-typecheck:
    name: Frontend TypeScript typecheck
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript diagnostics
        run: npm run typecheck

  frontend-tests:
    name: Node.js frontend domain contract tests
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run domain contract tests
        run: npm test

  frontend-build:
    name: Frontend production build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend independently of typecheck
        run: npm run build:frontend

  rust-format:
    name: Rust formatting
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  backend-build:
    name: Rust backend build check
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: x86_64-pc-windows-msvc
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: arm-rust-1.90-windows
      - name: Check backend and all targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --target x86_64-pc-windows-msvc

  rust-tests:
    name: Rust backend unit, command and database tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: x86_64-pc-windows-msvc
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: arm-rust-1.90-windows
      - name: Run all Rust backend unit, command and database tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

  rust-clippy:
    name: Rust Clippy lint
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: clippy
          targets: x86_64-pc-windows-msvc
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: arm-rust-1.90-windows
      - name: Run Clippy for all targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  windows-desktop-build:
    name: Windows Tauri desktop build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: x86_64-pc-windows-msvc
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: arm-rust-1.90-windows
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows desktop application without installer
        run: npm run tauri -- build --no-bundle

  cloud-api-integration:
    name: Cloud API build and PostgreSQL integration tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_DB: arm_test
          POSTGRES_USER: arm_test
          POSTGRES_PASSWORD: arm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arm_test -d arm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://arm_runtime:arm_runtime_test_password@localhost:5432/arm_test
      WORKER_DATABASE_URL: postgres://arm_worker:arm_worker_test_password@localhost:5432/arm_test
      MIGRATION_DATABASE_URL: postgres://arm_migrator:arm_migrator_test_password@localhost:5432/arm_test
      ADMIN_DATABASE_URL: postgres://arm_test:arm_test_password@localhost:5432/arm_test
      ARM_RUNTIME_PASSWORD: arm_runtime_test_password
      ARM_WORKER_PASSWORD: arm_worker_test_password
      ARM_MIGRATOR_PASSWORD: arm_migrator_test_password
      JWT_SECRET: ci-only-test-secret-which-is-longer-than-thirty-two-bytes
      MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-with-more-than-thirty-two-bytes
      ACCESS_TOKEN_TTL_SECONDS: 900
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install cloud API dependencies
        run: npm install --no-audit --no-fund
      - name: Create least-privilege runtime database role
        run: npm run db:bootstrap-runtime
      - name: Compile cloud API and worker
        run: npm run build
      - name: Apply migrations and run PostgreSQL integration tests
        run: npm test
